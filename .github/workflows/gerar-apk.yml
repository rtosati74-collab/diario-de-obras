name: Gerar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "windows/**"
      - ".github/workflows/gerar-windows.yml"
      - "docs/**"
      - "apps-script/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Testar cálculos
        run: npm test

      - name: Montar o app
        run: |
          npm run build
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DiarioDeObra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DiarioDeObra-apk
          path: DiarioDeObra.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Diário de Obra v1.0.${{ github.run_number }}
          body: Baixe o arquivo DiarioDeObra.apk abaixo pelo celular e toque nele para instalar.
          files: DiarioDeObra.apk
